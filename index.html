<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f4f7">
<title>明和商会 社有車ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* レイアウト: スマホ1カラム。上=使用者チップ、中=車両カード、下=固定の大ボタンとタブ */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#152030; --muted:#5b6778; --line:#d8dee7;
  --accent:#1f4fa3; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --free:#1d7347; --free-bg:#e5f3ea; --busy:#a85a06; --busy-bg:#fdf0dd; --busy-strong:#c66a08;
  --plate-bg:#fbfbf6; --plate-fg:#1b5a37; --shadow:0 1px 2px rgba(20,32,48,.06);
  --danger:#b42318; --danger-bg:#fdeceb; --note-bg:#eef1f5;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-head:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;
  /* スマホがダークモードでも常に明るい画面で表示する */
  color-scheme:light only;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-head);font-weight:900;font-size:19px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent)}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion: no-preference){.sync::before{animation:blink 1s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
.ver{margin:8px 0 0;font-size:11px;color:var(--muted);text-align:center}

main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
main.no-action{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.panel{display:flex;flex-direction:column;gap:22px;padding-block:18px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
/* 記録タブの手順見出し（1 車両を選ぶ → 2 使用者）は大きく、番号を丸で囲む */
#p-rec .sec-h{align-items:center}
.step{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-head);font-weight:900;font-size:clamp(22px,6vw,26px);line-height:1.2;color:var(--ink)}
.step-n{display:inline-grid;place-items:center;flex:none;width:1.4em;height:1.4em;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:.85em;font-variant-numeric:tabular-nums}
#p-rec .hint{font-size:13px;font-weight:700}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

/* 使用者チップ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 登録済みの使用者（このスマホ専用） */
.me-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.me-name{font-family:var(--f-head);font-weight:700;font-size:17px}
.me-sub{display:block;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.proxy{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-top:8px;
  background:var(--busy-bg);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--busy)}
.first{display:flex;flex-direction:column;gap:10px}
.first p{margin:0;font-size:13px;color:var(--muted)}
.first p b{color:var(--ink)}
.admin{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.admin p{margin:0;font-size:13px;color:var(--muted)}
.admin .row{display:flex;gap:8px;flex-wrap:wrap}
.admin input{flex:1 1 120px;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:18px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:44px;padding:8px 16px;font-size:14px}
.btn.plain{min-height:44px;padding:8px 14px;font-size:14px}

/* 車両カード */
.cars{display:flex;flex-direction:column;gap:10px}
.car{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.car[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
/* 車種名はスマホでひと目で読めるよう大きく（画面幅に合わせて26〜32px） */
.car-name{font-family:var(--f-head);font-weight:900;font-size:clamp(26px,7.6vw,32px);line-height:1.2;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.car-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:var(--muted)}
.plate{display:inline-block;background:var(--plate-bg);color:var(--plate-fg);border:2px solid var(--plate-fg);border-radius:4px;
  padding:1px 8px;font-weight:700;font-size:14px;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.free{background:var(--free-bg);color:var(--free)}
.pill.busy{background:var(--busy-bg);color:var(--busy)}
/* 車両カードの予定・お知らせ（点検・車検・お知らせ）。近い予定はオレンジ、期限切れは赤 */
.car-notes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.note{display:flex;align-items:baseline;gap:10px;border-radius:8px;padding:7px 10px;background:var(--note-bg);
  font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.note b{flex:none;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.note.warn{background:var(--busy-bg);color:var(--busy)}
.note.warn b{color:var(--busy)}
.note.danger{background:var(--danger-bg);color:var(--danger)}
.note.danger b{color:var(--danger)}
.busy-by{color:var(--ink);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* 下部固定: アクション + タブ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;flex-direction:column;gap:10px;padding-block:10px 0}
/* 返却時の「ガソリン少なめ」チェック */
.fuel{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);font-size:17px;font-weight:700;cursor:pointer}
.fuel input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--busy-strong)}
.fuel small{font-size:13px;font-weight:400;color:var(--muted)}
.fuel:has(input:checked){border-color:var(--busy-strong);background:var(--busy-bg);color:var(--busy)}
.act{width:100%;min-height:62px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px}
.act b{font-family:var(--f-head);font-size:20px;letter-spacing:.08em}
.act span{font-size:12px;opacity:.9}
.act.ret{background:var(--busy-strong);color:#fff}
.act:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{background:none;border:0;padding:10px 4px 12px;font-size:13px;font-weight:700;color:var(--muted);border-top:3px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}

/* お知らせ: 下部の固定エリアの中、ボタンの上に出す（画面の内容には重ならない） */
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 8px 8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;line-height:1.4}
.toast span{min-width:0;cursor:pointer}
.toast button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap}

/* ログ */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
input[type=month],select{width:100%;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.summary{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{font-size:13px;font-weight:700;color:var(--muted);padding-top:4px}
.log{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.log .t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.log .who{min-width:0}
.log .who div:first-child{font-weight:700}
.log .who div+div{font-size:12px;color:var(--muted)}
.log .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.log .open{color:var(--busy);font-weight:700}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-weight:700;min-height:32px;font-size:12px}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted);font-size:14px}
.empty b{color:var(--ink)}
.notice{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14px;margin-top:18px}
.loading{color:var(--muted);font-size:14px;padding:6px 2px}
@media (prefers-reduced-motion: no-preference){.chip,.car,.act,.tab{transition:background-color .15s,border-color .15s,box-shadow .15s}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">社有車ログ<small>MEIWA SHOKAI</small></div>
    <div class="top-r"><div class="today num" id="today"></div><div class="sync" id="sync" hidden>保存中…</div></div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <div id="conn" class="notice" hidden></div>

    <!-- 記録タブ -->
    <section class="panel" id="p-rec">
      <div class="sec">
        <div class="sec-h"><h2 class="step"><span class="step-n">1</span>車両を選ぶ</h2><span class="hint" id="car-count"></span></div>
        <div class="cars" id="cars"><div class="loading">読み込んでいます…</div></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h2 class="step"><span class="step-n">2</span>使用者</h2><span class="hint" id="people-hint"></span></div>
        <div id="people"><div class="loading">読み込んでいます…</div></div>
      </div>
    </section>

    <!-- ログタブ -->
    <section class="panel" id="p-log" hidden>
      <div class="filters">
        <div class="field full"><label for="f-month">月</label><input type="month" id="f-month"></div>
        <div class="field"><label for="f-car">車両</label><select id="f-car"></select></div>
        <div class="field"><label for="f-person">使用者</label><select id="f-person"></select></div>
      </div>
      <div class="sec">
        <div class="sec-h"><span class="label">月のまとめ</span><button class="btn" id="csv" hidden>CSVで保存</button></div>
        <div id="summary"><div class="loading">読み込んでいます…</div></div>
      </div>
      <div class="sec">
        <div class="label">記録</div>
        <div id="logs" class="sec"></div>
      </div>
    </section>
    <p class="ver num" id="ver"></p>
  </div>
</main>

<div class="dock" id="dock">
  <div class="wrap">
    <div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>取り消す</button></div>
    <label class="fuel" id="fuel" hidden><input type="checkbox" id="fuel-cb"><span>ガソリン少なめ<small>（給油が必要）</small></span></label>
    <button class="act" id="act" disabled><b>使用開始</b><span>読み込んでいます…</span></button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="rec" aria-selected="true">記録する</button>
      <button class="tab" role="tab" data-tab="log" aria-selected="false">ログ</button>
    </nav>
  </div>
</div>

<script src="config.js?v=2026.10.27-2"></script>
<script>
(() => {
  // 画面を更新したら APP_VERSION と version.json の両方を書き換える（スマホが自動で新しい版に切り替わる）
  const APP_VERSION = '2026.10.27-2';
  const CFG = window.CAR_LOG_CONFIG || {};
  const POLL_MS = 20000;

  // ===== 日時フォーマット（日本時間で統一） =====
  const TZ = 'Asia/Tokyo';
  const fHM = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fMD = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, month: 'numeric', day: 'numeric', weekday: 'short' });
  const fFull = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  const fYM = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit' });
  const fYMD = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const hm = ms => fHM.format(ms);
  const dur = min => min < 60 ? `${min}分` : `${Math.floor(min / 60)}時間${String(min % 60).padStart(2, '0')}分`;
  const mins = (a, b) => Math.max(0, Math.round((b - a) / 60000));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);

  // ===== 端末ごとの記憶（合言葉・選んだ使用者・タブ） =====
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
  };

  // ピン止めリンクの # 以降を合言葉として保存し、アドレスバーからは消す
  if (location.hash.length > 1) {
    store.set('meiwa-car-key', decodeURIComponent(location.hash.slice(1)));
    history.replaceState(null, '', location.pathname + location.search);
  }

  // ===== 状態 =====
  const S = {
    key: store.get('meiwa-car-key'),
    loaded: false, people: [], cars: [], status: {}, logs: [], logsLoaded: false,
    // me = このスマホに登録した本人（変更は管理者コードが必要）、pick = 初回登録前に選んだ名前
    me: store.get('meiwa-car-owner'), pick: null, adminOpen: false, carSel: null,
    tab: store.get('meiwa-car-tab') === 'log' ? 'log' : 'rec',
    month: fYM.format(Date.now()),
    pending: 0, undo: null, fatal: false, skew: 0
  };
  // スマホを見分けるための番号（登録の記録用。個人情報は含まない）
  let deviceId = store.get('meiwa-car-device');
  if (!deviceId) {
    deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    store.set('meiwa-car-device', deviceId);
  }
  // 端末の時計ずれを補正した現在時刻
  const now = () => Date.now() + S.skew;

  // ===== 通信 =====
  async function api(action, payload = {}) {
    let res;
    try {
      // text/plain で送ると Apps Script 側で余計な事前確認が起きない
      // 記録系は keepalive で、送信中にブラウザを閉じても最後まで届ける
      res = await fetch(CFG.apiUrl, {
        method: 'POST', keepalive: action !== 'state' && action !== 'logs',
        body: JSON.stringify({ action, key: S.key, ...payload })
      });
    } catch { throw { error: 'network' }; }
    if (!res.ok) throw { error: 'network' };
    const j = await res.json().catch(() => ({ ok: false, error: 'network' }));
    if (!j.ok) throw j;
    return j;
  }

  function applyState(st) {
    if (!st) return;
    S.people = st.people || []; S.cars = st.cars || []; S.status = st.status || {};
    if (st.now) S.skew = st.now - Date.now();
    // 名簿から消えた人（退職など）の登録は解除し、選び直してもらう
    if (S.me && !S.people.some(p => p.id === S.me)) { S.me = null; store.set('meiwa-car-owner', null); }
    if (S.pick && !S.people.some(p => p.id === S.pick)) S.pick = null;
    if (S.carSel && !S.cars.some(c => c.id === S.carSel)) S.carSel = null;
    S.loaded = true;
    renderPeople(); renderCars(); renderAction(); renderLogFilters();
  }

  // 保存待ちがある間は、画面の先行表示を上書きしないよう読み込まない
  async function refreshState() {
    if (S.pending || S.fatal) return;
    try {
      const st = (await api('state')).state;
      if (!S.pending) { applyState(st); hideConn(); }
    } catch (e) { handleErr(e, true); }
  }

  // ===== 保存の順番待ち =====
  // 押した操作は画面に先に反映し、保存は裏で1件ずつ順番に送る
  let queue = Promise.resolve();
  function enqueue(task) {
    S.pending++; renderSync();
    const p = queue.then(task);
    queue = p.catch(() => {});
    return p.finally(() => { S.pending--; renderSync(); });
  }
  function renderSync() { $('sync').hidden = !S.pending; }
  // 最後の保存が終わったときだけ、サーバーの正しい状態で画面を合わせる
  function applyIfLast(st) { if (S.pending === 1) applyState(st); }
  async function resync() {
    try { applyState((await api('state')).state); } catch {}
  }

  async function refreshLogs() {
    if (S.fatal) return;
    const month = S.month;
    try {
      const j = await api('logs', { month });
      if (month !== S.month) return; // 途中で月を切り替えた場合は捨てる
      S.logs = j.logs || []; S.logsLoaded = true;
      renderLogFilters(); renderLogs();
    } catch (e) { handleErr(e, true); }
  }

  // ===== 描画 =====
  function renderToday() { $('today').textContent = fMD.format(now()) + ' ' + hm(now()); }

  // 内容が変わったときだけ書き換える（定期更新で入力中の欄が消えないように）
  function setHTML(el, html) { if (el.__html !== html) { el.innerHTML = html; el.__html = html; } }

  // 選んだ車が「自分以外の人」が使用中なら、その車と状態を返す（本人以外は返却できない）
  function othersCar() {
    const car = S.cars.find(c => c.id === S.carSel);
    const st = car ? S.status[car.id] : null;
    if (!st?.inUse) return null;
    const me = findPerson() || S.people.find(p => p.id === S.pick);
    return me && me.name === st.userName ? null : { car, st };
  }

  // その人が今使用中の車の名前（なければ null）
  function usingCar(person) {
    const id = Object.keys(S.status).find(k => S.status[k]?.inUse && S.status[k].userName === person.name);
    return id ? (S.cars.find(c => c.id === id)?.name || id) : null;
  }

  function renderPeople() {
    const el = $('people');
    if (!S.loaded) return;
    const me = S.people.find(p => p.id === S.me);
    const other = othersCar();
    $('people-hint').textContent = me ? '' : '初回のみ';
    if (S.adminOpen === 'proxy' && !other) S.adminOpen = false;
    const codeRow = label => `<div class="row"><input id="admin-code" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="管理者コード">
        <button class="btn primary" type="submit">${label}</button><button class="btn plain" type="button" data-admin-close="1">やめる</button></div>`;
    if (me && S.adminOpen === 'unlock') {
      setHTML(el, `<form class="admin" id="admin-form">
        <p>登録を解除すると、このスマホで名前を選び直せます。<b>管理者コード（6桁）</b>を入力してください。</p>${codeRow('解除')}
      </form>`);
      return;
    }
    if (me && S.adminOpen === 'proxy') {
      setHTML(el, `<form class="admin" id="admin-form">
        <p><b>${esc(other.car.name)}</b>（${esc(other.st.userName)}さんが使用中）を、${esc(me.name)}さんが代理で返却します。<b>管理者コード（6桁）</b>を入力してください。</p>${codeRow('代理で返却')}
      </form>`);
      return;
    }
    if (me) {
      setHTML(el, `<div class="me-card"><div><span class="me-name">${esc(me.name)}</span> さん<span class="me-sub">このスマホに登録済み</span></div>
        <button class="linkbtn" data-admin-open="unlock">変更</button></div>
        ${other ? `<div class="proxy"><span>この車は${esc(other.st.userName)}さんが使用中です。返却できるのは本人だけです。</span>
        <button class="linkbtn" data-admin-open="proxy">管理者として代理返却</button></div>` : ''}`);
      return;
    }
    if (!S.people.length) {
      setHTML(el, `<div class="empty"><b>使用者がまだ登録されていません。</b><br>管理者がスプレッドシートの「使用者」シートに名前を追加すると、ここに表示されます。</div>`);
      return;
    }
    setHTML(el, `<div class="first">
      <p><b>あなたの名前を選んでください。</b>このスマホは選んだ人専用になり、次回からは選ぶ必要がありません（変更は管理者のみ）。</p>
      <div class="chips">${S.people.map(p =>
        `<button class="chip" data-person="${esc(p.id)}" aria-pressed="${p.id === S.pick}">${esc(p.name)}</button>`).join('')}</div>
    </div>`);
  }

  // 車両シートの点検予定日・車検予定・お知らせを、カードに出す行に変える
  function carNotes(c) {
    const today = fYMD.format(now()).split('-').map(Number);
    const dayNo = (y, m, d) => Date.UTC(y, m - 1, d) / 86400000;
    const items = [];
    if (c.inspect) {
      const [y, m, d] = c.inspect.split('-').map(Number);
      const left = dayNo(y, m, d) - dayNo(today[0], today[1], today[2]);
      // 点検日が過ぎたら表示しない（次の予定日に書き換えてもらう）
      if (left >= 0) {
        const when = left === 0 ? '今日' : left === 1 ? '明日' : fMD.format(Date.UTC(y, m - 1, d, 3));
        items.push({ cls: left <= 7 ? 'warn' : '', label: '点検', text: `${when} 点検予定` });
      }
    }
    if (c.shaken) {
      const [y, m] = c.shaken.split('-').map(Number);
      const left = (y * 12 + m) - (today[0] * 12 + today[1]);
      // 車検月を過ぎたら赤で知らせる（車検切れの車は運転できない）
      if (left < 0) items.push({ cls: 'danger', label: '車検', text: `車検月（${y}年${m}月）を過ぎています` });
      else items.push({ cls: left <= 1 ? 'warn' : '', label: '車検', text: `${y}年${m}月 車検予定` });
    }
    if (c.fuel) items.push({ cls: 'warn', label: '給油', text: `ガソリン少なめ（${c.fuel}）` });
    if (c.note) items.push({ cls: 'warn', label: 'お知らせ', text: c.note });
    if (!items.length) return '';
    return `<span class="car-notes">${items.map(n =>
      `<span class="note ${n.cls}"><b>${n.label}</b><span>${esc(n.text)}</span></span>`).join('')}</span>`;
  }

  function renderCars() {
    const el = $('cars');
    if (!S.loaded) return;
    const busyN = S.cars.filter(c => S.status[c.id]?.inUse).length;
    $('car-count').textContent = S.cars.length ? `${S.cars.length}台中 ${busyN}台 使用中` : '';
    if (!S.cars.length) {
      el.innerHTML = `<div class="empty"><b>車両がまだ登録されていません。</b><br>管理者がスプレッドシートの「車両」シートに車種とナンバーを追加すると、ここに表示されます。</div>`;
      return;
    }
    const t = now();
    el.innerHTML = S.cars.map(c => {
      const st = S.status[c.id];
      const pill = st?.inUse ? `<span class="pill busy">使用中</span>` : `<span class="pill free">空き</span>`;
      const meta = st?.inUse
        ? `<span><span class="busy-by">${esc(st.userName)}</span>さん · <span class="num">${hm(st.sinceMs)}</span>から（${dur(mins(st.sinceMs, t))}）</span>`
        : (st?.lastReturnMs ? `<span>最終返却 <span class="num">${fMD.format(st.lastReturnMs)} ${hm(st.lastReturnMs)}</span></span>` : '');
      return `<button class="car" data-car="${esc(c.id)}" aria-pressed="${c.id === S.carSel}">
        <span class="car-name">${esc(c.name)}</span>${pill}
        <span class="car-meta">${c.plate ? `<span class="plate">${esc(c.plate)}</span>` : ''}${meta}</span>${carNotes(c)}
      </button>`;
    }).join('');
  }

  function renderAction() {
    const btn = $('act');
    const show = S.tab === 'rec' && !S.fatal;
    btn.hidden = !show;
    $('main').classList.toggle('no-action', !show);
    if (!show) return;
    const me = findPerson();
    const person = me || S.people.find(p => p.id === S.pick);
    const car = S.cars.find(c => c.id === S.carSel);
    const st = car ? S.status[car.id] : null;
    btn.classList.toggle('ret', !!st?.inUse && !othersCar());
    let title = st?.inUse ? '返却する' : '使用開始', sub = '', ok = false;
    if (!S.loaded) sub = '読み込んでいます…';
    else if (!car) sub = '① 車両を選んでください';
    else if (!st?.inUse && person && usingCar(person)) {
      // 1人1台まで。使用中の車を返してからでないと使えない
      title = '使用できません';
      sub = `${usingCar(person)} を返却してから使用してください`;
    }
    else if (st?.inUse && (me || person) && othersCar()) {
      // 他の人が使用中の車は返却できない
      title = '使用中';
      sub = `${st.userName}さんが使用中です（返却は本人のみ）`;
    }
    else if (!person) sub = '② あなたの名前を選んでください';
    else {
      ok = true;
      if (!me) {
        // 初回は登録と同時に記録する
        title = `${person.name}さんで${st?.inUse ? '返却' : '使用開始'}`;
        sub = `このスマホを${person.name}さん専用に登録します`;
      } else if (st?.inUse) sub = `${car.name} · ${st.userName}さんの使用を返却`;
      else sub = `${person.name}さん · ${car.name}`;
    }
    btn.innerHTML = `<b>${esc(title)}</b><span>${esc(sub)}</span>`;
    btn.disabled = !ok;
    // 自分の車を返却するときだけ「ガソリン少なめ」を出す
    $('fuel').hidden = !(ok && st?.inUse);
  }

  function filteredLogs() {
    const fc = $('f-car').value, fp = $('f-person').value;
    return S.logs.filter(l => (!fc || l.carId === fc) && (!fp || l.userName === fp));
  }

  function renderLogFilters() {
    // 選択値を保ったまま選択肢を作り直す
    const keep = (sel, opts) => {
      const v = sel.value;
      sel.innerHTML = `<option value="">すべて</option>` + opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
      sel.value = opts.includes(v) ? v : '';
    };
    // 車両・使用者はシートの一覧＋ログ内の名前（削除済み含む）
    const cars = new Set(S.cars.map(c => c.id)); S.logs.forEach(l => cars.add(l.carId));
    const names = new Set(S.people.map(p => p.name)); S.logs.forEach(l => names.add(l.userName));
    keep($('f-car'), [...cars]);
    keep($('f-person'), [...names]);
  }

  function renderLogs() {
    if (!S.logsLoaded) return;
    const list = filteredLogs();
    const t = now();
    $('csv').hidden = !list.length;

    // 車両ごとの集計
    const agg = new Map();
    list.forEach(l => {
      const a = agg.get(l.carId) || { name: l.carName, n: 0, m: 0 };
      a.n++; a.m += mins(l.startMs, l.endMs || t);
      agg.set(l.carId, a);
    });
    const totalM = [...agg.values()].reduce((s, a) => s + a.m, 0);
    $('summary').innerHTML = !list.length
      ? `<div class="empty">この月の記録はありません。「記録する」タブで使用開始をタップすると、ここにたまっていきます。</div>`
      : `<div class="summary"><table><thead><tr><th>車両</th><th class="r">回数</th><th class="r">使用時間</th></tr></thead><tbody>
          ${[...agg.values()].map(a => `<tr><td>${esc(a.name)}</td><td class="r">${a.n}回</td><td class="r">${dur(a.m)}</td></tr>`).join('')}
          ${agg.size > 1 ? `<tr><td><b>合計</b></td><td class="r"><b>${list.length}回</b></td><td class="r"><b>${dur(totalM)}</b></td></tr>` : ''}
        </tbody></table></div>`;

    // 日付ごとのリスト
    const days = new Map();
    list.forEach(l => { const k = fMD.format(l.startMs); (days.get(k) || days.set(k, []).get(k)).push(l); });
    $('logs').innerHTML = [...days].map(([d, ls]) => `<div class="day"><div class="day-h">${esc(d)}</div>${ls.map(l => {
      const range = `${hm(l.startMs)}–${l.endMs ? hm(l.endMs) : ''}`;
      const sub = [l.plate, l.returnedBy && l.returnedBy !== l.userName ? `返却：${l.returnedBy}さん` : '', l.fuelLow ? 'ガソリン少なめ' : ''].filter(Boolean).join(' · ');
      const right = l.endMs ? dur(mins(l.startMs, l.endMs)) : `<span class="open">使用中</span>`;
      return `<div class="log"><span class="t">${range}</span><div class="who"><div>${esc(l.userName)} · ${esc(l.carName)}</div>${sub ? `<div>${esc(sub)}</div>` : ''}</div><span class="d">${right}</span></div>`;
    }).join('')}</div>`).join('');
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
    $('p-rec').hidden = S.tab !== 'rec';
    $('p-log').hidden = S.tab !== 'log';
    renderAction();
  }

  // ===== お知らせ・エラー =====
  let toastTimer;
  function toast(msg, undoable = false) {
    $('toast-msg').textContent = msg;
    $('toast-undo').hidden = !undoable;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    // 取り消し付きは6秒、それ以外は3秒で消す
    toastTimer = setTimeout(hideToast, undoable ? 6000 : 3000);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    $('toast').hidden = true;
    S.undo = null;
  }
  function showConn(html) { $('conn').innerHTML = html; $('conn').hidden = false; }
  function hideConn() { if (!S.fatal) $('conn').hidden = true; }

  // 開けない状態（設定漏れ・合言葉なし）は画面全体で案内する
  function fatal(html) {
    S.fatal = true;
    showConn(html);
    $('p-rec').hidden = true; $('p-log').hidden = true; $('dock').hidden = true;
    $('main').classList.add('no-action');
  }
  const PIN_MSG = 'Mattermost の「車両管理」チャンネルにピン止めされたリンクから開き直してください。';

  function handleErr(e, quiet = false) {
    const code = e?.error;
    if (code === 'auth') { store.set('meiwa-car-key', null); fatal(`<b>このリンクでは記録を開けません。</b><br>${PIN_MSG}`); return; }
    if (code === 'in_use') { toast(`${e.userName}さんがすでに使用中です`); applyState(e.state); return; }
    if (code === 'not_in_use') { toast('この車両はすでに返却されています'); applyState(e.state); return; }
    if (code === 'already_using') { toast(`${e.carName} を使用中です。返却してから使用してください`); applyState(e.state); return; }
    if (code === 'not_owner') { toast(`${e.userName}さんが使用中です。返却できるのは本人だけです`); applyState(e.state); return; }
    if (code === 'undo_expired') { toast('時間が経ったため取り消せませんでした'); applyState(e.state); return; }
    if (code === 'unknown_user' || code === 'unknown_car') { toast('名簿が更新されました。選び直してください'); refreshState(); return; }
    if (code === 'busy') { toast('混み合っています。もう一度押してください'); return; }
    if (quiet) { showConn('通信できません。電波の良い場所で開き直すと最新の状態になります。'); return; }
    toast('通信できず保存できませんでした。画面を最新の状態に戻したので、もう一度押してください');
  }

  const findPerson = () => S.people.find(p => p.id === S.me);
  const findCar = () => S.cars.find(c => c.id === S.carSel);

  // ===== 使用開始・返却 =====
  // 押した瞬間に画面を切り替えて完了を知らせ、保存は裏で行う
  function onAct() {
    const car = findCar();
    if (!car || othersCar()) return;
    const who = findPerson() || S.people.find(p => p.id === S.pick);
    if (!S.status[car.id]?.inUse && who && usingCar(who)) return;
    if (!findPerson()) {
      // 初回：選んだ名前でこのスマホを登録してから記録する
      const pick = S.people.find(p => p.id === S.pick);
      if (!pick) return;
      registerDevice(pick);
    }
    const person = findPerson();
    if (!person) return;
    const prev = S.status[car.id];
    const inUse = !!prev?.inUse;
    const t = now();
    // 返却時の「ガソリン少なめ」。カードの給油メモも先に書き換えておく
    const fuelLow = inUse ? $('fuel-cb').checked : undefined;
    const prevFuel = car.fuel || '';
    if (inUse) setCarFuel(car.id, fuelLow ? `${fMDshort(t)} ${person.name}さんが報告` : '');
    S.status = { ...S.status, [car.id]: inUse
      ? { inUse: false, lastReturnMs: t, lastUserName: prev.userName }
      : { inUse: true, userName: person.name, sinceMs: t, logId: null } };
    renderCars(); renderAction();
    // 取り消し用の控え。logId は保存が終わった時点で入る
    const op = { type: inUse ? 'return' : 'start', carId: car.id, prev, prevFuel, logId: null, failed: false };
    S.undo = op;
    toast(inUse
      ? `${hm(t)}　${car.name} を返却しました（${dur(mins(prev.sinceMs, t))}）${fuelLow ? '・ガソリン少なめ' : ''}`
      : `${hm(t)}　${car.name} の使用を開始しました`, true);

    enqueue(async () => {
      try {
        const j = await api(op.type, { carId: car.id, userName: person.name, ...(inUse ? { fuelLow } : {}) });
        op.logId = j.logId;
        applyIfLast(j.state);
        if (S.logsLoaded && S.pending === 1) refreshLogs();
      } catch (e) {
        op.failed = true;
        if (S.undo === op) { S.undo = null; $('toast-undo').hidden = true; }
        handleErr(e);
        if (!e?.state) await resync();
      }
    });
  }

  // 画面上の車両の給油メモを書き換える（サーバーの返事を待たずに表示を合わせる）
  function setCarFuel(carId, memo) {
    S.cars = S.cars.map(c => c.id === carId ? { ...c, fuel: memo } : c);
  }
  const fMDshort = ms => { const [, m, d] = fYMD.format(ms).split('-').map(Number); return `${m}/${d}`; };

  // このスマホを本人専用にする。画面ではすぐ確定し、登録の記録は裏で送る
  function registerDevice(person) {
    S.me = person.id; S.pick = null;
    store.set('meiwa-car-owner', S.me);
    renderPeople();
    enqueue(async () => {
      try { await api('register', { userName: person.name, deviceId, ua: navigator.userAgent.slice(0, 200) }); }
      catch (e) { if (e?.error === 'auth') handleErr(e); } // 登録の記録に失敗しても使用は続けられる
    });
  }

  // 管理者コードで「登録の解除」または「代理返却」を行う
  // コードが違うこともあるので、ここだけは先に画面を変えずサーバーの返事を待つ
  async function onAdminSubmit(ev) {
    ev.preventDefault();
    const mode = S.adminOpen;
    const code = $('admin-code').value.trim();
    if (!/^\d{6}$/.test(code)) { toast('管理者コードは6桁の数字です'); return; }
    const btn = ev.target.querySelector('button[type=submit]');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = '確認中…';
    try {
      if (mode === 'proxy') {
        const other = othersCar(), me = findPerson();
        if (!other || !me) { S.adminOpen = false; renderPeople(); return; }
        const j = await enqueue(() => api('return', { carId: other.car.id, userName: me.name, code }));
        S.adminOpen = false;
        applyState(j.state);
        toast(`${hm(j.at)}　${other.car.name}（${other.st.userName}さん）を代理で返却しました`);
        if (S.logsLoaded) refreshLogs();
        return;
      }
      await api('admin', { code });
      S.me = null; S.adminOpen = false;
      store.set('meiwa-car-owner', null);
      renderPeople(); renderAction();
      toast('登録を解除しました。② で名前を選び直してください');
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      if (e?.error === 'admin_auth') toast('管理者コードが違います');
      else if (e?.error === 'admin_locked') toast('間違いが続いたため、10分間は管理者コードを受け付けません');
      else handleErr(e);
    }
  }

  function onUndo() {
    const op = S.undo; if (!op) return;
    S.undo = null; $('toast').hidden = true;
    // 画面はすぐ元に戻し、保存済みの記録は裏で取り消す
    S.status = { ...S.status, [op.carId]: op.prev };
    if (op.type === 'return') setCarFuel(op.carId, op.prevFuel);
    renderCars(); renderAction();
    toast('取り消しました');

    enqueue(async () => {
      if (op.failed || !op.logId) return; // 記録自体が保存されていなければ何もしない
      try {
        const j = await api('undo', { type: op.type, logId: op.logId, ...(op.type === 'return' ? { prevFuel: op.prevFuel } : {}) });
        applyIfLast(j.state);
        if (S.logsLoaded && S.pending === 1) refreshLogs();
      } catch (e) {
        handleErr(e);
        if (!e?.state) await resync();
      }
    });
  }

  // ===== CSV保存 =====
  function saveCsv() {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['車両', 'ナンバー', '使用者', '使用開始', '返却', '返却者', '使用時間(分)', 'ガソリン少なめ']];
    filteredLogs().slice().reverse().forEach(l => rows.push([
      l.carName, l.plate, l.userName, fFull.format(l.startMs), l.endMs ? fFull.format(l.endMs) : '使用中',
      l.returnedBy || '', l.endMs ? mins(l.startMs, l.endMs) : '', l.fuelLow ? '○' : ''
    ]));
    // Excelで文字化けしないようBOM付き
    const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `社有車ログ_${S.month}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ===== イベント =====
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    // 名前を選べるのは未登録のスマホだけ
    if (t.dataset.person) { if (!findPerson()) { S.pick = t.dataset.person; renderPeople(); renderAction(); } return; }
    if (t.dataset.adminOpen) { S.adminOpen = t.dataset.adminOpen; renderPeople(); $('admin-code')?.focus(); return; }
    if (t.dataset.adminClose) { S.adminOpen = false; renderPeople(); return; }
    if (t.dataset.car) {
      S.carSel = S.carSel === t.dataset.car ? null : t.dataset.car;
      // ガソリン少なめの報告がある車は、最初からチェックを入れておく（給油したら外して返却）
      $('fuel-cb').checked = !!findCar()?.fuel;
      if (S.adminOpen === 'proxy') S.adminOpen = false;
      renderCars(); renderPeople(); renderAction(); return;
    }
    if (t.dataset.tab) {
      S.tab = t.dataset.tab; store.set('meiwa-car-tab', S.tab); renderTabs(); window.scrollTo(0, 0);
      if (S.tab === 'log') refreshLogs();
    }
  });
  document.addEventListener('submit', e => { if (e.target.id === 'admin-form') onAdminSubmit(e); });
  $('act').addEventListener('click', onAct);
  $('toast-undo').addEventListener('click', onUndo);
  // お知らせの文字をタップするとすぐ消える
  $('toast-msg').addEventListener('click', hideToast);
  // 下部の固定エリアの高さ（お知らせの有無で変わる）に合わせて、画面の下の余白を取る
  if (window.ResizeObserver) {
    new ResizeObserver(() => { $('main').style.paddingBottom = ($('dock').offsetHeight + 16) + 'px'; }).observe($('dock'));
  }
  $('csv').addEventListener('click', saveCsv);
  $('f-car').addEventListener('change', renderLogs);
  $('f-person').addEventListener('change', renderLogs);
  $('f-month').addEventListener('change', () => {
    if (!$('f-month').value) return;
    S.month = $('f-month').value; S.logsLoaded = false;
    $('summary').innerHTML = '<div class="loading">読み込んでいます…</div>'; $('logs').innerHTML = '';
    refreshLogs();
  });
  // アプリに戻ってきたら最新の状態を取り直す
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkUpdate(); refreshState(); if (S.tab === 'log') refreshLogs(); }
  });

  // ===== 新しい版の自動読み込み =====
  // version.json の版がこの画面と違えば読み込み直す。保存待ちの間は待つ
  // 公開直後は配信側に古い版が残ることがあるので、同じ版への読み込み直しは1回だけにする
  async function checkUpdate() {
    if (S.pending) return;
    try {
      const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const latest = (await res.json()).version;
      if (!latest || latest === APP_VERSION) return;
      let tried = null; try { tried = sessionStorage.getItem('meiwa-car-reloaded'); } catch {}
      if (tried === latest) return;
      try { sessionStorage.setItem('meiwa-car-reloaded', latest); } catch {}
      location.reload();
    } catch {}
  }

  // ===== 起動 =====
  $('ver').textContent = 'ver. ' + APP_VERSION;
  checkUpdate();
  $('f-month').value = S.month;
  renderToday(); renderTabs();
  setInterval(() => { renderToday(); if (S.tab === 'rec') renderCars(); }, 30000);

  if (!CFG.apiUrl) { fatal('<b>接続先が設定されていません。</b><br>管理者が config.js に Apps Script の URL を設定してください。'); return; }
  if (!S.key) { fatal(`<b>最初の1回はリンクから開いてください。</b><br>${PIN_MSG}`); return; }

  refreshState();
  if (S.tab === 'log') refreshLogs();
  setInterval(() => { if (document.visibilityState === 'visible') refreshState(); }, POLL_MS);
})();
</script>
</body>
</html>
